name: Validate and deploy website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check service-aware enquiry flow
        run: node --test test/*.test.mjs
      - name: Prepare public website and check JavaScript
        run: node scripts/prepare-deploy.mjs
      - name: Validate Worker assets configuration
        run: npx --yes wrangler@4.119.0 deploy --config wrangler.jsonc --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist
      - name: Select publishing route
        id: publishing
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const configured = Boolean(process.env.CLOUDFLARE_DEPLOY_HOOK || (process.env.CLOUDFLARE_API_TOKEN && process.env.CLOUDFLARE_ACCOUNT_ID));
          appendFileSync(process.env.GITHUB_OUTPUT, 'configured=' + configured + '\n');
          console.log(configured ? 'Publishing through GitHub credentials.' : 'Waiting for the connected native Cloudflare Workers Build; separate GitHub credentials are not required.');
          NODE
      - name: Deploy existing Cloudflare website
        if: steps.publishing.outputs.configured == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.mjs
      - name: Verify current chat on production website
        run: node scripts/verify-deploy.mjs
